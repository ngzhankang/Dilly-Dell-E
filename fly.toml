app = "dilly-dell-e"
primary_region = "sin"

[build]
  builder = "docker"
  dockerfile = "Dockerfile.fly"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["backend"]

[processes]
  backend = "cd backend && npm run build && npm start"

[[services]]
  protocol = "tcp"
  internal_port = 3001

  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[deploy]
  release_command = "npm ci"

[checks.http_check]
  grace_period = "30s"
  interval = "10s"
  method = "GET"
  path = "/health"
  protocol = "http"
  timeout = "5s"
  tls_skip_verify = false
