apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: dilly-dell-e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
    spec:
      containers:
        - name: ml-service
          image: ghcr.io/your-org/dilly-dell-e/ml-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: /app/models/model.onnx
